name: SimCore

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux ${{ matrix.compiler }}${{ matrix.sanitize == 'ON' && ' + sanitizers' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            sanitize: OFF
          - compiler: clang++
            sanitize: OFF
          - compiler: g++
            sanitize: ON
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Tests/SimCore -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DEMPIRE_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    # MSVC is the compiler Unreal Engine uses on Windows.
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Tests/SimCore -B build
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
